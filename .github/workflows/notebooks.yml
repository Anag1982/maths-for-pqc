name: notebooks

# Re-executes every chapter's lab notebook headlessly on every push and PR.
# Each notebook's final cell is a _selftest() that asserts every numerical
# claim the corresponding book chapter makes -- so this workflow fails if a
# library update silently breaks a fact in the printed text, not just a plot.
#
# Add a new job block here each time a chXX/ folder gets a lab notebook.

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  ch01:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -r ch01/requirements.txt
      - run: |
          python -m jupyter nbconvert --to notebook --execute \
            --ExecutePreprocessor.timeout=300 \
            --stdout ch01/lab01.ipynb > /dev/null

  ch02:
